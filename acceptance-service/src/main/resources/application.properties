spring.application.name=acceptance-service
server.port=${SERVER_PORT:8081}
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:h2:file:./data/acceptance_db;DB_CLOSE_ON_EXIT=FALSE}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:sa}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:}
spring.datasource.driver-class-name=org.h2.Driver
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.sql.init.mode=always
spring.kafka.bootstrap-servers=${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
spring.kafka.producer.key-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.value-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.consumer.key-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.consumer.value-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.consumer.auto-offset-reset=earliest
spring.kafka.listener.ack-mode=record
spring.kafka.listener.missing-topics-fatal=true
spring.kafka.listener.concurrency=3
spring.kafka.template.default-topic=orders.accepted
spring.kafka.admin.fail-fast=true
app.kafka.processed-topic=orders.processed
app.outbox.poll-ms=${OUTBOX_POLL_MS:500}
management.endpoints.web.exposure.include=health,info,metrics
management.endpoint.health.probes.enabled=true
springdoc.swagger-ui.path=/swagger-ui.html
logging.pattern.console=%d{yyyy-MM-dd'T'HH:mm:ss.SSSXXX} %-5level [%thread] %logger{36} correlationId=%X{correlationId:-} eventId=%X{eventId:-} orderId=%X{orderId:-} eventType=%X{eventType:-} - %msg%n
